<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ranura Sync</title>
  <style>
    body { font-family: sans-serif; width: 250px; padding: 10px; text-align: center; }
    button { color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 8px; }
    .btn-shopee { background: #ee4d2d; }
    .btn-shopee:hover { background: #d74226; }
    .btn-tiktok { background: #000000; }
    .btn-tiktok:hover { background: #333333; }
  </style>
</head>
<body>
  <h3 style="margin-top:0;">Ranura Auto-Sync</h3>
  <p style="font-size: 12px; color: #555;">Buka halaman "Pesanan Saya" di Seller Center, lalu klik tombol sesuai platform.</p>
  <button id="btnShopee" class="btn-shopee">Sedot Data (Shopee)</button>
  <button id="btnTiktok" class="btn-tiktok">Sedot Data (TikTok)</button>
  <p id="status" style="font-size: 12px; color: green; margin-top: 10px;"></p>
  <script src="popup.js"></script>
</body>
</html>
